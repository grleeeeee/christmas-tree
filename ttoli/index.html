<!doctype html>
<html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>똘이 (ttoli)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#0d0f14;color:#d9dde6;display:grid;place-items:center;
  font:15px/1.4 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;padding:16px}
.card{width:100%;max-width:640px;background:#11141c;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px #0009}
.stage{position:relative;aspect-ratio:1/1.12;background:#07080c}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:18px;top:14px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#7d8699;pointer-events:none}
.hud b{display:block;font-size:18px;color:#fff}
#clock{position:absolute;right:18px;top:18px;font:12px ui-monospace,Menlo,monospace;color:#7d8699}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-right:6px}
.bar{height:3px;background:#232836}.bar i{display:block;height:100%;width:0;background:#f0502d}
.ctl{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;color:#7d8699;font-size:12px}
.ctl button{font:inherit;font-size:15px;color:#d9dde6;background:#1a1f2c;border:1px solid #2c3345;border-radius:10px;padding:9px 14px}
</style>
<main class=card>
  <section class=stage>
    <canvas id=cv></canvas>
    <div class=hud><b>@ttoli 똘이</b><span id=hr></span></div>
    <div id=clock></div>
  </section>
  <div class=bar><i id=bar></i></div>
  <div class=ctl><span>10초 동안 그려지고, 20초 동안 펀치하며 돌아요.</span><button id=pause>일시정지</button></div>
</main>
<script>
const $ = id => document.getElementById(id);
const FPS = 40, DRAW = 10, LOOP = 30, TURNS = 2, START = -0.6;   // 10s draw at a diagonal, 20s spin
const FRAMES = 6, FW = 200, FH = 170, FRAME_S = 0.12;           // sprite sheet cut from the punch GIF
const RAMP = " .,:;-=+*x%#&@W", RL = RAMP.length - 1, TAU = Math.PI * 2;
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return s - Math.floor(s); };
let paused = false, t = +new URLSearchParams(location.search).get("t") || 0;

const cv = $("cv"), ctx = cv.getContext("2d"), sheet = new Image();
let COLS, cs, ch, fs, dpr, W, H, x0, y0, CELLS = [];
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  COLS = Math.min(230, Math.max(110, Math.round(r.width / 2.5)));
  cs = cv.width / COLS; fs = cs / 0.6; ch = fs * 1.05;
  W = Math.round(COLS * 0.94); H = Math.round(W * cs * FH / FW / ch);   // the card, in cells
  x0 = cv.width / 2; y0 = (cv.height - H * ch) / 2 + 2 * ch;
  if (!sheet.complete || !sheet.naturalWidth) return;
  const oc = document.createElement("canvas"); oc.width = W; oc.height = H;
  const g = oc.getContext("2d", { willReadFrequently: true });
  CELLS = Array.from({ length: FRAMES }, (_, f) => {             // every frame -> glyph + color per cell
    g.drawImage(sheet, f * FW, 0, FW, FH, 0, 0, W, H);
    const px = g.getImageData(0, 0, W, H).data, out = new Array(W * H);
    for (let i = 0; i < W * H; i++) {
      const R = px[i * 4], G = px[i * 4 + 1], B = px[i * 4 + 2];
      const lum = Math.min(1, Math.max(0, (0.3 * R + 0.59 * G + 0.11 * B) / 255 - 0.05) ** 0.85 * 1.3), q = Math.round(lum * RL);
      const k = 1.25, m = 28;
      out[i] = q ? [RAMP[q], `rgb(${Math.min(255, m + R * k) | 0},${Math.min(255, m + G * k) | 0},${Math.min(255, m + B * k) | 0})`] : null;
    }
    return out;
  });
}
addEventListener("resize", resize);
sheet.onload = resize; sheet.src = "frames.jpg"; resize();

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!CELLS.length) return;
  const ang = START + (t < DRAW ? 0 : (t - DRAW) / (LOOP - DRAW) * TAU * TURNS);
  const ca = Math.cos(ang), sa = Math.sin(ang), half = W / 2;
  const frame = CELLS[Math.floor(t / FRAME_S) % FRAMES];         // the punch keeps playing
  ctx.font = `bold ${fs}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const wide = Math.abs(ca) * half;
  for (let dc = -Math.floor(wide); dc <= wide; dc++) {           // card turning on its vertical axis
    const u = dc / (half * ca), sc = Math.min(W - 1, Math.max(0, Math.round((u + 1) / 2 * (W - 1))));
    const persp = 1 + 0.16 * u * sa;                             // far edge looks shorter
    for (let r = 0; r < H; r++) {
      const born = r / H * 8.6 + hash(sc, r) * 1.2;
      if (t < born) continue;
      const cell = frame[r * W + sc];
      const x = x0 + dc * cs, y = y0 + ((r - H / 2) * persp + H / 2) * ch;
      if (t - born < 0.25) { ctx.fillStyle = "#fff"; ctx.fillText("*", x, y); continue; }   // fresh ink
      if (!cell) continue;
      ctx.fillStyle = cell[1]; ctx.fillText(cell[0], x, y);
    }
  }
  $("hr").textContent = `rotation ${((((ang - START) * 180 / Math.PI) % 360 + 360) % 360).toFixed(0)}° · punches ${Math.floor(t / (FRAME_S * FRAMES) * 2)}`;
  $("clock").innerHTML = `<i class=dot></i>${t < DRAW ? "drawing" : "spinning"} ${t.toFixed(1)}s`;
  $("bar").style.width = t / LOOP * 100 + "%";
}

let last = -1e9;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - last < 1000 / FPS - 2) return;
  const dt = Math.min(0.1, Math.max(0, now - last) / 1000); last = now;
  if (!paused) { t += dt; if (t > LOOP) t = 0; }
  draw();
}
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "재생" : "일시정지"; };
requestAnimationFrame(tick);
</script>
