<!doctype html>
<html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>똘이 (ttoli)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#0d0f14;color:#d9dde6;display:grid;place-items:center;
  font:15px/1.4 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;padding:16px}
.card{width:100%;max-width:560px;background:#11141c;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px #0009}
.stage{position:relative;aspect-ratio:1/1.25;background:linear-gradient(#0b0d14,#161a24 62%,#1d222e)}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:18px;top:16px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#7d8699;pointer-events:none}
.hud b{display:block;font-size:20px;color:#fff;margin-bottom:6px}
.hud i{color:#cfd6e6;font-style:normal;margin-left:6px}
#clock{position:absolute;right:18px;top:18px;font:12px ui-monospace,Menlo,monospace;color:#7d8699}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-right:6px}
.bar{height:3px;background:#232836}.bar i{display:block;height:100%;width:0;background:#f0502d}
.ctl{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;color:#7d8699;font-size:12px}
.ctl button{font:inherit;font-size:15px;color:#d9dde6;background:#1a1f2c;border:1px solid #2c3345;border-radius:10px;padding:9px 14px}
@media(min-width:900px){.card{max-width:640px}}
</style>
<main class=card>
  <section class=stage>
    <canvas id=cv></canvas>
    <div class=hud><b>@ttoli 똘이</b>rotation<i id=hr></i><br>punches<i id=hp></i><br>letters<i id=hn></i></div>
    <div id=clock></div>
  </section>
  <div class=bar><i id=bar></i></div>
  <div class=ctl><span>10초 동안 그려지고, 20초 동안 펀치하며 돌아요.</span><button id=pause>일시정지</button></div>
</main>
<script>
const $ = id => document.getElementById(id);
const FPS = 40, DRAW = 10, LOOP = 30, TURNS = 2;          // 10s draw, 20s spin (2 turns)
const PITCH = 12 * Math.PI / 180, cp = Math.cos(PITCH), sp = Math.sin(PITCH);
const RAMP = ".,:;-=+*x%#&@W", RL = RAMP.length - 1, TAU = Math.PI * 2;
const norm = v => { const l = Math.hypot(...v); return v.map(a => a / l); };
const L = norm([-0.55, 0.5, 0.67]);
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return s - Math.floor(s); };
const FUR = 0, DARK = 1, SHINE = 2;
const PAL = [...RAMP].map((_, i) => `hsl(${28 + 14 * i / RL} ${24 - 14 * i / RL}% ${46 + 54 * i / RL}%)`);  // warm white fur
let paused = false, t = +new URLSearchParams(location.search).get("t") || 0;

// 1) 똘이: a fluffy white poodle standing up, made of ellipsoids
//    [group, kind, x, y, z, rx, ry, rz] — group 0 body, 1 left arm, 2 right arm (arms punch)
const side = f => [-1, 1].flatMap(s => f(s));
const PARTS = [
  [0, FUR, 0, -0.27, 0, 0.26, 0.42, 0.24],                    // torso
  [0, FUR, 0, 0.0, 0.05, 0.28, 0.25, 0.26],                   // chest fluff
  [0, FUR, 0, 0.5, 0.05, 0.34, 0.31, 0.31],                   // big round head
  [0, FUR, 0, 0.42, 0.3, 0.14, 0.11, 0.12],                   // muzzle
  [0, DARK, 0, 0.45, 0.415, 0.05, 0.04, 0.035],               // nose
  [0, DARK, 0, 0.365, 0.385, 0.04, 0.014, 0.02],              // mouth
  [0, FUR, 0, -0.5, -0.27, 0.09, 0.09, 0.09],                 // tail pom
  ...side(s => [
    [0, FUR, s * 0.37, 0.43, 0, 0.13, 0.22, 0.13],            // floppy ear
    [0, DARK, s * 0.13, 0.565, 0.3, 0.042, 0.042, 0.03],      // eye
    [0, SHINE, s * 0.118, 0.58, 0.328, 0.013, 0.013, 0.01],   // eye highlight
    [0, FUR, s * 0.16, -0.62, 0.02, 0.15, 0.2, 0.17],         // haunch
    [0, FUR, s * 0.17, -0.8, 0.1, 0.12, 0.07, 0.15],          // hind foot
    [s < 0 ? 1 : 2, FUR, s * 0.22, -0.05, 0.22, 0.1, 0.1, 0.2],     // forearm
    [s < 0 ? 1 : 2, FUR, s * 0.23, -0.03, 0.42, 0.125, 0.12, 0.12], // paw
    [s < 0 ? 1 : 2, DARK, s * 0.23, -0.065, 0.533, 0.045, 0.035, 0.02],  // paw pad
    ...[-0.05, 0, 0.05].map(d => [s < 0 ? 1 : 2, DARK, s * 0.23 + d, 0.005, 0.53, 0.02, 0.02, 0.015]),  // toes
  ])];

// 2) sample every part into a dense point cloud (finer than one cell)
let N = 0, GRP, KIND, PX, PY, PZ, NX, NY, NZ, BORN, NOISE;
function build(step) {
  const a = [];
  PARTS.forEach(([grp, kind, cx, cy, cz, rx, ry, rz], pi) => {
    const n = Math.ceil(4 * Math.PI * ((rx + ry + rz) / 3) ** 2 / step ** 2 * 1.4);
    for (let i = 0; i < n; i++) {         // fibonacci sphere, with curly bumps on the fur
      const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), th = i * 2.39996;
      const d = [r * Math.cos(th), y, r * Math.sin(th)];
      const curl = kind === FUR ? 1 + 0.05 * Math.sin(th * 9 + pi) * Math.sin(y * 14 + pi * 2) : 1;
      const p = [cx + d[0] * rx * curl, cy + d[1] * ry * curl, cz + d[2] * rz * curl];
      a.push([grp, kind, ...p, ...norm([d[0] / rx, d[1] / ry, d[2] / rz]),
        (0.83 - p[1]) / 1.75 * 8.4 + hash(Math.floor(th * 3), Math.floor(y * 9) + pi) * 1.1,
        0.72 + 0.56 * hash(Math.floor(th * 40) + pi, Math.floor(y * 60))]);
    }
  });
  N = a.length;
  [GRP, KIND] = [0, 1].map(f => Uint8Array.from(a, p => p[f]));
  [PX, PY, PZ, NX, NY, NZ, BORN, NOISE] = Array.from({ length: 8 }, (_, f) => Float32Array.from(a, p => p[f + 2]));
}

// 3) canvas grid + camera
const cv = $("cv"), ctx = cv.getContext("2d");
let COLS, ROWS, cs, ch, fs, dpr, SX, SY, cx, cy, G, C, GL, Z, W;
const bokeh = Array.from({ length: 9 }, (_, i) => [0.55 + hash(i, 1) * 0.45, 0.08 + hash(i, 2) * 0.3,
  0.02 + hash(i, 3) * 0.03, ["255,170,80", "255,240,220", "120,170,255"][i % 3]]);
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  COLS = Math.min(200, Math.max(90, Math.round(r.width / 2.9)));
  cs = cv.width / COLS; fs = cs / 0.6; ch = fs * 1.05;
  ROWS = Math.floor(cv.height / ch);
  const S = Math.min(cv.height * 0.8 / 1.8, cv.width * 0.84 / 1.1);   // px per world unit
  SX = S / cs; SY = S / ch; cx = COLS / 2; cy = ROWS * 0.56;
  G = new Array(COLS * ROWS); C = []; GL = [];
  Z = new Float32Array(COLS * ROWS); W = new Int32Array(COLS * ROWS);
  build(0.75 / SX);
}
addEventListener("resize", resize); resize();

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const [x, y, r, c] of bokeh) {     // blurry night-street lights far behind
    const R = r * cv.width, g = ctx.createRadialGradient(x * cv.width, y * cv.height, 0, x * cv.width, y * cv.height, R);
    g.addColorStop(0, `rgba(${c},0.5)`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.fillRect(x * cv.width - R, y * cv.height - R, 2 * R, 2 * R);
  }
  ctx.fillStyle = "rgba(0,0,0,0.45)";     // floor shadow
  ctx.beginPath(); ctx.ellipse(cx * cs, (cy + 0.86 * cp * SY) * ch, 0.5 * SX * cs, 0.09 * SX * cs, 0, 0, TAU); ctx.fill();

  G.fill(undefined); Z.fill(-1e9); W.fill(-1);
  const ang = t < DRAW ? 0 : (t - DRAW) / (LOOP - DRAW) * TAU * TURNS, ca = Math.cos(ang), sa = Math.sin(ang);
  const jab = [0, Math.max(0, Math.sin(t * 7)) ** 0.7, Math.max(0, -Math.sin(t * 7)) ** 0.7];  // alternate paws
  const bob = 0.012 * Math.abs(Math.sin(t * 7));
  let shown = 0;
  for (let i = 0; i < N; i++) {           // z-buffer: keep the nearest point per cell
    if (t < BORN[i]) continue;
    const g = GRP[i], p = jab[g];
    const lx = PX[i] - (g ? Math.sign(PX[i]) * p * 0.06 : 0), ly = PY[i] + bob + p * 0.07, lz = PZ[i] + p * 0.26;
    const x = lx * ca - lz * sa, z = lz * ca + lx * sa;
    const c = Math.round(cx + x * SX), r = Math.round(cy - (ly * cp - z * sp) * SY);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue;
    const d = z * cp + ly * sp, k = r * COLS + c;
    if (d > Z[k]) { Z[k] = d; W[k] = i; }
  }
  for (let k = 0; k < W.length; k++) {    // shade only what is visible
    const i = W[k];
    if (i < 0) continue;
    shown++;
    if (t - BORN[i] < 0.3) { G[k] = "*"; C[k] = "#fff"; GL[k] = true; continue; }   // fresh ink
    if (KIND[i] === DARK) { G[k] = "@"; C[k] = "#1c1b22"; GL[k] = false; continue; }
    if (KIND[i] === SHINE) { G[k] = "*"; C[k] = "#fff"; GL[k] = false; continue; }
    const nx = NX[i] * ca - NZ[i] * sa, nz1 = NZ[i] * ca + NX[i] * sa;
    const ny = NY[i] * cp - nz1 * sp, nz = nz1 * cp + NY[i] * sp;
    const b = Math.min(1, (0.5 + 0.6 * Math.max(0, L[0] * nx + L[1] * ny + L[2] * nz)) * NOISE[i]);
    const q = Math.floor(b * RL);
    G[k] = RAMP[q]; C[k] = PAL[q]; GL[k] = false;
  }
  ctx.font = `bold ${fs}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = 0; i < G.length; i++) {
    if (!G[i]) continue;
    ctx.fillStyle = C[i];
    ctx.shadowColor = C[i]; ctx.shadowBlur = GL[i] ? 6 * dpr : 0;
    ctx.fillText(G[i], ((i % COLS) + 0.5) * cs, (Math.floor(i / COLS) + 0.5) * ch);
  }
  ctx.shadowBlur = 0;
  $("hr").textContent = ((ang * 180 / Math.PI) % 360).toFixed(1) + "°";
  $("hp").textContent = Math.floor(t * 7 / Math.PI);
  $("hn").textContent = shown.toLocaleString();
  $("clock").innerHTML = `<i class=dot></i>${t < DRAW ? "drawing" : "spinning"} ${t.toFixed(1)}s`;
  $("bar").style.width = t / LOOP * 100 + "%";
}

// 4) main loop, capped at 40 fps
let last = -1e9;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - last < 1000 / FPS - 2) return;
  const dt = Math.min(0.1, Math.max(0, now - last) / 1000); last = now;
  if (!paused) { t += dt; if (t > LOOP) t = 0; }
  draw();
}
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "재생" : "일시정지"; };
requestAnimationFrame(tick);
</script>
